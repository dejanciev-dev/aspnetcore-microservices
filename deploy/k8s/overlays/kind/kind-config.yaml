# Single-node kind cluster whose node ports appear on the host's localhost, so the browser,
# Keycloak's issuer and the BFF redirect URIs match Docker Compose exactly.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: storefront
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30420, hostPort: 4200 }    # storefront
      - { containerPort: 30808, hostPort: 8080 }    # Keycloak
      - { containerPort: 30888, hostPort: 18888 }   # Aspire dashboard
