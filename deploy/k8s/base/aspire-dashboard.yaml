# Receives OTLP logs, metrics and traces from every service and shows them (port 18888).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-dashboard
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: aspire-dashboard }
  template:
    metadata:
      labels: { app.kubernetes.io/name: aspire-dashboard }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: aspire-dashboard
          image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
          ports:
            - { name: ui, containerPort: 18888 }
            - { name: otlp, containerPort: 18889 }
          env:
            - { name: ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS, value: "true" }   # reach it via port-forward only
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: aspire-dashboard
spec:
  selector: { app.kubernetes.io/name: aspire-dashboard }
  ports:
    - { name: ui, port: 18888, targetPort: ui }
    - { name: otlp, port: 18889, targetPort: otlp }
