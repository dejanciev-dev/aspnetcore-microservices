apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: storefront }
  template:
    metadata:
      labels: { app.kubernetes.io/name: storefront }
    spec:
      automountServiceAccountToken: false
      # The stock nginx image starts as root to bind port 80 and then drops to the nginx user, so
      # this pod doesn't meet the restricted profile; an unprivileged nginx image on 8080 would.
      containers:
        - name: storefront
          image: storefront
          ports:
            - { name: http, containerPort: 80 }
          # Static files plus the proxy to api-gateway:8080 (nginx.conf); no backend check here,
          # so a gateway restart doesn't take the static app down.
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector: { app.kubernetes.io/name: storefront }
  ports:
    - { name: http, port: 80, targetPort: http }
