# In-cluster PostgreSQL for the demo; a managed database is the production choice.
# Catalog and Ordering create their own databases (catalogdb, orderingdb) when they migrate.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: storefront-secrets, key: postgres-password } }
          readinessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, postgres] }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }   # PostgreSQL 18+ images keep data below here
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
