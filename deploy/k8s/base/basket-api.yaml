apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
spec:
  # Stateless (baskets live in Redis), so it scales horizontally.
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: basket-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: basket-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: basket-api
          image: basket-api
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: service-config }
          env:
            - { name: OTEL_SERVICE_NAME, value: basket-api }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: storefront-secrets, key: rabbitmq-password } }
            - { name: ConnectionStrings__redis, value: "redis:6379" }
            - name: ConnectionStrings__rabbitmq
              value: amqp://storefront:$(RABBITMQ_PASSWORD)@rabbitmq:5672
            - { name: Services__Catalog, value: "http://catalog-api:8080" }
            - { name: Services__Ordering, value: "http://ordering-api:8080" }
          startupProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: basket-api
spec:
  selector: { app.kubernetes.io/name: basket-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
