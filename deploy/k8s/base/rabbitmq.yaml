# Message broker. A StatefulSet keeps the pod name (rabbitmq-0), and so the node name its data
# directory belongs to, stable across restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          env:
            # A dedicated user: RabbitMQ only lets "guest" connect from localhost.
            - { name: RABBITMQ_DEFAULT_USER, value: storefront }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: storefront-secrets, key: rabbitmq-password } }
          readinessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, ping] }
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, ping] }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
