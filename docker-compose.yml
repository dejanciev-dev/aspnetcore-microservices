# Full stack in containers:  docker compose up --build
#   Storefront        http://localhost:4200
#   API gateway       http://localhost:5100
#   Aspire dashboard  http://localhost:18888   (logs, metrics, distributed traces)
#   PostgreSQL        localhost:5432            (postgres / ${POSTGRES_PASSWORD:-postgres})
#   Redis             localhost:6379
#   RabbitMQ UI       http://localhost:15672    (storefront / ${RABBITMQ_PASSWORD:-storefront})

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment: &otel-env
    ASPNETCORE_ENVIRONMENT: Development   # keeps the OpenAPI/Scalar docs enabled for the demo
    OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  catalog-api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/Dockerfile
      args:
        PROJECT: Services/Catalog/Catalog.API/Catalog.API.csproj
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: catalog-api
      ConnectionStrings__catalogdb: Host=postgres;Database=catalogdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__rabbitmq: amqp://storefront:${RABBITMQ_PASSWORD:-storefront}@rabbitmq:5672
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  ordering-api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/Dockerfile
      args:
        PROJECT: Services/Ordering/Ordering.API/Ordering.API.csproj
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ordering-api
      ConnectionStrings__orderingdb: Host=postgres;Database=orderingdb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__rabbitmq: amqp://storefront:${RABBITMQ_PASSWORD:-storefront}@rabbitmq:5672
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  basket-api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/Dockerfile
      args:
        PROJECT: Services/Basket/Basket.API/Basket.API.csproj
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: basket-api
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__rabbitmq: amqp://storefront:${RABBITMQ_PASSWORD:-storefront}@rabbitmq:5672
      Services__Catalog: http://catalog-api:8080
      Services__Ordering: http://ordering-api:8080
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      catalog-api: { condition: service_started }
      ordering-api: { condition: service_started }

  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/Dockerfile
      args:
        PROJECT: ApiGateways/ApiGateway/ApiGateway.csproj
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: api-gateway
      ReverseProxy__Clusters__catalog__Destinations__d1__Address: http://catalog-api:8080
      ReverseProxy__Clusters__basket__Destinations__d1__Address: http://basket-api:8080
      ReverseProxy__Clusters__ordering__Destinations__d1__Address: http://ordering-api:8080
    ports:
      - "5100:8080"
    depends_on: [catalog-api, basket-api, ordering-api]

  storefront:
    build: src/Web/storefront
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on: [api-gateway]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}   # override via .env for anything non-local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql   # PostgreSQL 18+ images keep data under this path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]   # persist baskets across restarts
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      # A dedicated user: RabbitMQ only lets "guest" connect from localhost.
      RABBITMQ_DEFAULT_USER: storefront
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-storefront}
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    restart: unless-stopped
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"   # local demo only
    ports:
      - "18888:18888"

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
