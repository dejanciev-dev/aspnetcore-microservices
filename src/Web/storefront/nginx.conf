# Rendered at container start by the nginx image (/etc/nginx/templates): ${GATEWAY_URL} comes from
# the environment (Dockerfile default http://api-gateway:8080; Azure Container Apps uses
# http://api-gateway). nginx's own $variables are left alone.

# Behind another TLS-terminating proxy (Container Apps, an ingress controller) keep its scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API, BFF and OIDC callback paths are forwarded to the YARP gateway, so the
  # session cookie stays first-party and no CORS is needed. The request's Host is the gateway's
  # own (Container Apps routes internal traffic by Host); the browser's host travels in
  # X-Forwarded-Host, which the gateway uses to build redirect URIs.
  location ~ ^/(api|bff)/|^/signin-oidc$|^/signout-callback-oidc$ {
    proxy_pass ${GATEWAY_URL};
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffer_size 16k;    # auth cookies carrying tokens are large
    proxy_buffers 8 16k;
  }

  # Hashed bundles can be cached forever; index.html must always be revalidated.
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing: unknown paths fall back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
