server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API, BFF and OIDC callback paths are forwarded to the YARP gateway, so the
  # session cookie stays first-party and no CORS is needed. The browser's host is preserved
  # so the gateway builds redirect URIs for http://localhost:4200.
  location ~ ^/(api|bff)/|^/signin-oidc$|^/signout-callback-oidc$ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffer_size 16k;    # auth cookies carrying tokens are large
    proxy_buffers 8 16k;
  }

  # Hashed bundles can be cached forever; index.html must always be revalidated.
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing: unknown paths fall back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
