# Azure Developer CLI: `azd up` provisions infra/ (Azure Container Apps) and deploys every service.
# Images are built in Azure Container Registry (remoteBuild), so Docker isn't needed locally.
# Catalog and Ordering run their migration job from a postpublish hook, which uses the Azure CLI.
# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: storefront
metadata:
  template: aspnetcore-microservices

infra:
  provider: bicep
  path: infra

services:
  catalog-api:
    project: src/Services/Catalog/Catalog.API
    host: containerapp
    language: docker
    docker:
      path: ../../../Dockerfile
      context: ../../../..
      remoteBuild: true
      buildArgs:
        - PROJECT=Services/Catalog/Catalog.API/Catalog.API.csproj
    # Migrate with the image just pushed, before the new revision rolls out (needs `az login`).
    hooks:
      postpublish:
        posix:
          shell: sh
          run: bash "$(git rev-parse --show-toplevel)/infra/scripts/run-migration-job.sh" catalog-api
        windows:
          shell: pwsh
          run: '& "$(git rev-parse --show-toplevel)/infra/scripts/run-migration-job.ps1" catalog-api'

  basket-api:
    project: src/Services/Basket/Basket.API
    host: containerapp
    language: docker
    docker:
      path: ../../../Dockerfile
      context: ../../../..
      remoteBuild: true
      buildArgs:
        - PROJECT=Services/Basket/Basket.API/Basket.API.csproj

  ordering-api:
    project: src/Services/Ordering/Ordering.API
    host: containerapp
    language: docker
    docker:
      path: ../../../Dockerfile
      context: ../../../..
      remoteBuild: true
      buildArgs:
        - PROJECT=Services/Ordering/Ordering.API/Ordering.API.csproj
    # Migrate with the image just pushed, before the new revision rolls out (needs `az login`).
    hooks:
      postpublish:
        posix:
          shell: sh
          run: bash "$(git rev-parse --show-toplevel)/infra/scripts/run-migration-job.sh" ordering-api
        windows:
          shell: pwsh
          run: '& "$(git rev-parse --show-toplevel)/infra/scripts/run-migration-job.ps1" ordering-api'

  api-gateway:
    project: src/ApiGateways/ApiGateway
    host: containerapp
    language: docker
    docker:
      path: ../../Dockerfile
      context: ../../..
      remoteBuild: true
      buildArgs:
        - PROJECT=ApiGateways/ApiGateway/ApiGateway.csproj

  storefront:
    project: src/Web/storefront
    host: containerapp
    language: docker
    docker:
      remoteBuild: true

  keycloak:
    project: deploy/keycloak
    host: containerapp
    language: docker
    docker:
      remoteBuild: true
