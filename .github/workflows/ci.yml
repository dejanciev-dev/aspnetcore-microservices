name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore aspnetcore-microservices.slnx
      - run: dotnet build aspnetcore-microservices.slnx -c Release --no-restore
      # Microsoft.Testing.Platform (see global.json). Integration tests start PostgreSQL and
      # Redis with Testcontainers using the runner's Docker; CI=true makes them fail, not skip,
      # if Docker is missing.
      - run: >-
          dotnet test --solution aspnetcore-microservices.slnx -c Release --no-build
          --report-trx --coverage --coverage-output-format cobertura
          --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/

  frontend:
    name: Angular build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web/storefront
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/storefront/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx ng test --watch=false

  containers:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-api, basket-api, ordering-api, api-gateway, storefront]
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.service }} image
        run: |
          set -o pipefail
          if ! docker compose build --progress=plain ${{ matrix.service }} 2>&1 | tee build.log; then
            # Surface the end of the build output as an annotation on the run/PR.
            echo "::error title=docker build ${{ matrix.service }}::$(tail -n 40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
