name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore aspnetcore-microservices.slnx
      - run: dotnet build aspnetcore-microservices.slnx -c Release --no-restore
      # Microsoft.Testing.Platform (see global.json). Integration tests start PostgreSQL and
      # Redis with Testcontainers using the runner's Docker; CI=true makes them fail, not skip,
      # if Docker is missing.
      - run: >-
          dotnet test --solution aspnetcore-microservices.slnx -c Release --no-build
          --report-trx --coverage --coverage-output-format cobertura
          --results-directory TestResults
      # Consumer contract tests rewrite the pact files that the provider tests verify. Any change
      # here means a contract moved without the new pact being committed (and reviewed).
      - name: Check pact files are committed
        run: |
          if [ -n "$(git status --porcelain -- tests/Services.ContractTests/pacts)" ]; then
            git --no-pager diff -- tests/Services.ContractTests/pacts
            echo "::error title=Pact files out of date::Run the contract tests locally and commit tests/Services.ContractTests/pacts."
            exit 1
          fi
      - name: Report failed tests as annotations
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in glob.glob("TestResults/**/*.trx", recursive=True):
              for result in ET.parse(path).getroot().iterfind(".//t:UnitTestResult", ns):
                  if result.get("outcome") != "Failed":
                      continue
                  message = result.findtext(".//t:Message", default="", namespaces=ns)
                  stack = result.findtext(".//t:StackTrace", default="", namespaces=ns)
                  text = (message + "\n" + stack)[:3000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={result.get('testName')}::{text}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/

  frontend:
    name: Angular build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web/storefront
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/storefront/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx ng test --watch=false

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The whole system as in production-like local use: nginx-served storefront, gateway,
      # services, PostgreSQL, Redis, RabbitMQ and Keycloak. --wait blocks until healthchecks pass.
      - name: Start the stack
        working-directory: .
        run: docker compose up --detach --build --wait --wait-timeout 600
      - run: npx playwright test
      - name: Container logs
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --timestamps > compose.log; tail -n 300 compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            compose.log

  containers:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-api, basket-api, ordering-api, api-gateway, storefront]
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.service }} image
        run: |
          set -o pipefail
          if ! docker compose build --progress=plain ${{ matrix.service }} 2>&1 | tee build.log; then
            # Surface the end of the build output as an annotation on the run/PR.
            echo "::error title=docker build ${{ matrix.service }}::$(tail -n 40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
